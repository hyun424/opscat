services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opscat
      POSTGRES_PASSWORD: opscat
      POSTGRES_DB: opscat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opscat-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opscat:opscat@db:5432/opscat
      OPSCAT_MODE: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  opscat-postgres:
