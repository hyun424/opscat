[project]
name = "opscat"
version = "0.2.0"
description = "Evidence-bound, fail-closed agentic incident response for local and sandbox evaluation"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "OpsCat contributors"}]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.41",
  "pydantic-settings>=2.10.0",
  "psycopg[binary]>=3.2.9",
]

[project.optional-dependencies]
llm = [
  "openai>=2.0.0",
]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0",
  "pip-audit==2.10.1",
]

[project.urls]
Repository = "https://github.com/gimdonghyeon/opscat"
Documentation = "https://github.com/gimdonghyeon/opscat/tree/main/docs"

[project.scripts]
opscat = "app.cli:main"
opscat-monitor = "app.monitor_cli:main"
opscat-triage-deadman = "app.p140_deadman_cli:main"
opscat-notification-authority = "app.p141_notification_cli:main"
opscat-triage-service = "app.p139_service_cli:main"

[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.opscat.coverage]
min_total = 60.0
