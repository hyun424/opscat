name: OpsCat CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPSCAT_MODE: test
      DATABASE_URL: sqlite:///opscat-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project dependencies
        run: uv sync --frozen --extra dev
      - name: Run portable verification
        run: bash scripts/verify.sh --profile fast
      - name: Run complete verification profile
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: bash scripts/verify.sh --profile full

  release-sequence:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPSCAT_MODE: test
      DATABASE_URL: sqlite:///opscat-ci.db
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - name: Build current reproducible package evidence
        run: uv run --no-sync --extra dev python scripts/verify_p122_reproducible_build.py
      - name: Verify current clean install and uninstall
        run: uv run --no-sync --extra dev python scripts/verify_p122_clean_install.py
      - name: Refresh environment-bound security and release evidence
        run: |
          uv run --no-sync --extra dev python scripts/run_p122_security_gate.py
          uv run --no-sync --extra dev python scripts/run_p122_vulnerability_audit.py
          uv run --no-sync --extra dev python scripts/build_p122_release_evidence.py --output evals/p122/release-evidence.json
      - name: Verify full P115-P122 release sequence
        run: |
          for phase in 115 116 117 118 119 120 121 122; do
            bash scripts/verify.sh --profile "p${phase}-release"
          done
      - name: Upload bounded release reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: p115-p122-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            evals/p115/release-evidence.json
            evals/p116/release-evidence.json
            evals/p117/release-evidence.json
            evals/p118/release-evidence.json
            evals/p119/release-evidence.json
            evals/p120/release-evidence.json
            evals/p121/release-evidence.json
            evals/p122/*.json
          if-no-files-found: error
          retention-days: 7

  container-package-config:
    runs-on: ubuntu-latest
    env:
      OPSCAT_MODE: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Build credential-free package container
        run: |
          docker build --tag opscat:p122-ci --file - . <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /src
          COPY . .
          RUN python -m pip install --no-cache-dir --no-deps .
          RUN opscat contracts > /tmp/contracts.json
          CMD ["opscat", "demo", "--output", "/tmp/opscat-demo.json"]
          DOCKERFILE
      - name: Validate local configuration boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/opscat.local.example.json").read_text())
          required_false = (
              "live_api_calls_enabled",
              "production_mutation_enabled",
              "remediation_execution_enabled",
              "unrestricted_shell_enabled",
              "default_external_model_calls",
              "auth_session_work_enabled",
          )
          if config.get("mode") != "local-mock" or any(config.get(key) is not False for key in required_false):
              raise SystemExit("unsafe local container configuration")
          PY
      - name: Run network-free container demo
        run: docker run --rm --network none --read-only --tmpfs /tmp opscat:p122-ci
