server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: p174-docker-containers
    static_configs:
      - targets: ["localhost"]
        labels:
          job: p174-docker-containers
          purpose: opscat-lab
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
